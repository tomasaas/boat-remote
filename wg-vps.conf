# WireGuard on the VPS: the boat's tunnel. VPS = 10.88.0.1, Pi = 10.88.0.2.
# `make install` fills in the keys and installs it as /etc/wireguard/boat.conf (service wg-quick@boat).
[Interface]
Address = 10.88.0.1/24
ListenPort = 51820
PrivateKey = @VPS_KEY@

[Peer]
# The boat (Raspberry Pi 5). No Endpoint: the Pi connects to us, and WireGuard follows
# its address when the 4G IP changes.
PublicKey = @PI_PUB@
AllowedIPs = 10.88.0.2/32
