<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Caddy shows this when the boat doesn't answer. Reloads every 5 s, so the GUI appears by itself. -->
<meta http-equiv="refresh" content="5">
<title>Båt</title>
<style>
  :root { --bg: #f6f7f9; --card: #fff; --text: #1b1f24; --muted: #6b7280; --line: #e3e6ea; --rev: #dc2626; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111418; --card: #1a1e24; --text: #e8eaed; --muted: #9aa1ab; --line: #2a3038; --rev: #f87171; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 16px; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  h1 { font-size: 20px; margin: 0; }
  h2 { font-size: 15px; margin: 0 0 4px; }
  #conn { font-size: 13px; padding: 2px 10px; border-radius: 99px; background: var(--rev); color: #fff; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 12px; }
  .note { color: var(--muted); font-size: 13px; margin: 4px 0 10px; }
  code { font-size: 13px; }
  ul { margin: 0; padding-left: 20px; }
  li { margin: 4px 0; }
</style>
</head>
<body>
<main>
  <header><h1>Båt</h1><span id="conn">Ikke tilkoblet</span></header>
  <div class="card">
    <h2>Får ikke kontakt med båten</h2>
    <p class="note">VPS-en er oppe, men båten svarer ikke. Siden prøver igjen hvert 5. sekund.</p>
    <ul>
      <li>Er Pi-en slått på, og har 4G-ruteren dekning?</li>
      <li>Er tunnelen oppe? På VPS-en: <code>make status</code>. På Pi-en: <code>sudo wg show</code>.</li>
      <li>Kjører appen? På Pi-en: <code>journalctl -u boat -f</code>.</li>
    </ul>
  </div>
</main>
</body>
</html>
