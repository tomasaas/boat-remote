# WireGuard on the boat's Pi: a tunnel out to the VPS. Made by `make pi` on the VPS.
# Contains the Pi's private key. On the Pi:
#   sudo apt install -y wireguard-tools
#   save this as /etc/wireguard/boat.conf
#   sudo systemctl enable --now wg-quick@boat
[Interface]
Address = 10.88.0.2/24
PrivateKey = @PI_KEY@

[Peer]
# The VPS. Only traffic to the VPS goes through the tunnel; everything else goes out as usual.
PublicKey = @VPS_PUB@
Endpoint = @IP@:51820
AllowedIPs = 10.88.0.1/32
# A packet every 25 s keeps the 4G router's NAT open, so the VPS can always reach the Pi.
PersistentKeepalive = 25
